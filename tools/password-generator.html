<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg-card: #1a2028;
      --bg-input: #232b35;
      --fg: #e6edf3;
      --fg-muted: #8b96a3;
      --accent: #7fc8a9;
      --accent-hover: #95d4b8;
      --on-accent: #0f1419;
      --border: #2d3744;
      --border-hover: #3a4555;
      --row-divider: rgba(45, 55, 68, 0.5);
      --success: #7fc8a9;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      --bg-gradient:
        radial-gradient(1200px 600px at 80% -10%, rgba(127, 200, 169, 0.08), transparent 60%),
        radial-gradient(900px 500px at -10% 100%, rgba(127, 200, 169, 0.05), transparent 60%),
        linear-gradient(135deg, #0b0f14 0%, #141b24 100%);
      --hover-tint: rgba(127, 200, 169, 0.08);
      --strength-weak: #ff8a65;
      --strength-ok: #ffc46b;
      --strength-strong: #7fc8a9;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg-card: #ffffff;
        --bg-input: #f3f5f9;
        --fg: #1a2028;
        --fg-muted: #5c6773;
        --accent: #2d8a6b;
        --accent-hover: #246e55;
        --on-accent: #ffffff;
        --border: #dde2e8;
        --border-hover: #b8c1cc;
        --row-divider: rgba(45, 55, 68, 0.1);
        --success: #2d8a6b;
        --shadow: 0 12px 40px rgba(15, 30, 50, 0.08), 0 4px 12px rgba(15, 30, 50, 0.05);
        --bg-gradient:
          radial-gradient(1200px 600px at 80% -10%, rgba(45, 138, 107, 0.07), transparent 60%),
          radial-gradient(900px 500px at -10% 100%, rgba(45, 138, 107, 0.05), transparent 60%),
          linear-gradient(135deg, #f5f7fa 0%, #e8edf3 100%);
        --hover-tint: rgba(45, 138, 107, 0.07);
        --strength-weak: #d9533a;
        --strength-ok: #c98a00;
        --strength-strong: #2d8a6b;
      }
    }

    html {
      font-size: 16px;
      scrollbar-gutter: stable;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1.5rem, 6vh, 4rem) 1rem 3rem;
      line-height: 1.5;
    }

    main {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
      max-width: 620px;
      width: 100%;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .password-display {
      background: var(--bg-input);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.1rem 1.1rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.2s;
    }

    .password-display:hover {
      border-color: var(--border-hover);
    }

    #password {
      font-family: "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;
      font-size: 1.2rem;
      font-weight: 500;
      flex: 1;
      word-break: break-all;
      color: var(--accent);
      user-select: all;
      cursor: text;
      min-height: 1.5em;
      letter-spacing: 0.01em;
    }

    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.55rem 1.05rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-copy {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .btn-copy:hover {
      background: var(--border);
    }

    .btn-copy.copied {
      background: var(--success);
      color: var(--on-accent);
      border-color: var(--success);
    }

    .btn-generate {
      background: var(--accent);
      color: var(--on-accent);
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      letter-spacing: 0.01em;
    }

    .btn-generate:hover {
      background: var(--accent-hover);
    }

    .btn-generate:active {
      transform: translateY(1px);
    }

    .format-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 0.75rem;
      gap: 2px;
    }

    .format-tab {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.55rem 0.5rem;
      border-radius: 7px;
      color: var(--fg-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
    }

    .format-tab:hover:not(.active) {
      color: var(--fg);
      background: var(--hover-tint);
    }

    .format-tab.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .controls {
      background: var(--bg-input);
      border-radius: 12px;
      padding: 0.5rem 1.25rem;
      margin-bottom: 1rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0;
      gap: 1rem;
      border-bottom: 1px solid var(--row-divider);
    }

    .control-row:last-child {
      border-bottom: none;
    }

    .control-row>label:first-child {
      font-size: 0.9rem;
      color: var(--fg);
      flex: 1 1 auto;
    }

    .control-row .value {
      color: var(--accent);
      font-weight: 600;
      font-family: "SF Mono", monospace;
      min-width: 1.5em;
      text-align: right;
      font-size: 0.95rem;
    }

    input[type="range"] {
      flex: 0 1 180px;
      accent-color: var(--accent);
      height: 4px;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked+.slider {
      background: var(--accent);
    }

    .toggle input:checked+.slider:before {
      transform: translateX(18px);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.82rem;
      color: var(--fg-muted);
      margin-top: 0.2rem;
      padding: 0.7rem 0 0.2rem;
    }

    .meta strong {
      color: var(--accent);
      font-weight: 600;
    }

    .strength-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.6rem;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease, background 0.25s ease;
    }

    .strength-fill.weak {
      background: var(--strength-weak);
    }

    .strength-fill.ok {
      background: var(--strength-ok);
    }

    .strength-fill.strong {
      background: var(--strength-strong);
    }

    .wordlist-toggle {
      display: inline-block;
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      padding: 0;
      margin-top: 0.5rem;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }

    .wordlist-toggle:hover {
      color: var(--accent-hover);
    }

    #wordlist {
      display: none;
      margin-top: 0.75rem;
      padding: 1rem;
      background: var(--bg-input);
      border-radius: 8px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--fg-muted);
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.7;
      word-spacing: 0.4em;
    }

    #wordlist.show {
      display: block;
    }

    /* History section */
    .history {
      margin-top: 1.25rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.55rem;
      padding: 0 0.25rem;
    }

    .history-header h2 {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history-header .count {
      color: var(--accent);
      font-family: "SF Mono", monospace;
      font-weight: 600;
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
      padding: 0.25rem 0.55rem;
      border-radius: 5px;
      transition: all 0.15s;
    }

    .btn-clear:hover {
      color: var(--fg);
      background: var(--bg-input);
    }

    .btn-clear:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-clear:disabled:hover {
      background: none;
      color: var(--fg-muted);
    }

    .history-list {
      background: var(--bg-input);
      border-radius: 10px;
      list-style: none;
      padding: 0.3rem;
      max-height: 320px;
      overflow-y: auto;
    }

    .history-empty {
      color: var(--fg-muted);
      text-align: center;
      padding: 1.1rem;
      font-size: 0.85rem;
      font-style: italic;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .history-item+.history-item {
      margin-top: 1px;
    }

    .history-item:hover {
      background: var(--hover-tint);
    }

    .history-item .idx {
      font-family: "SF Mono", monospace;
      font-size: 0.72rem;
      color: var(--fg-muted);
      flex: 0 0 auto;
      min-width: 1.6em;
      text-align: right;
    }

    .history-item .pw {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.88rem;
      flex: 1;
      word-break: break-all;
      color: var(--fg);
      user-select: all;
      cursor: text;
    }

    .history-item .pw.newest {
      color: var(--accent);
    }

    .history-item .btn-mini {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      padding: 0.25rem 0.55rem;
      font-size: 0.72rem;
      border-radius: 5px;
      cursor: pointer;
      flex: 0 0 auto;
      transition: all 0.15s;
    }

    .history-item .btn-mini:hover {
      color: var(--fg);
      border-color: var(--accent);
    }

    .history-item .btn-mini.copied {
      color: var(--on-accent);
      background: var(--success);
      border-color: var(--success);
    }

    @media (max-width: 540px) {
      main {
        padding: 1.5rem 1.25rem;
      }

      #password {
        font-size: 1rem;
      }

      .control-row {
        flex-wrap: wrap;
      }

      input[type="range"] {
        flex: 1 1 100%;
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>🔐 Password Generator</h1>

    <div class="password-display">
      <div id="password">Click Generate</div>
      <button class="btn-copy" id="copy" title="Copy to clipboard">Copy</button>
    </div>

    <button class="btn-generate" id="generate">Generate New Password</button>

    <div class="format-tabs" role="tablist">
      <button class="format-tab active" data-format="words" type="button">Words</button>
      <button class="format-tab" data-format="random" type="button">Random</button>
      <button class="format-tab" data-format="pronounceable" type="button">Pronounceable</button>
    </div>

    <div class="controls format-section" data-format="words">
      <div class="control-row">
        <label for="wordCount">Number of words</label>
        <input type="range" min="2" max="5" value="2" id="wordCount">
        <span class="value" id="wordCountVal">2</span>
      </div>
      <div class="control-row">
        <label for="digitCount">Digits per number group</label>
        <input type="range" min="2" max="4" value="2" id="digitCount">
        <span class="value" id="digitCountVal">2</span>
      </div>
      <div class="control-row">
        <label for="symbolSep">Random symbols as separators</label>
        <label class="toggle">
          <input type="checkbox" id="symbolSep">
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="appendSymbol">Append symbol at end</label>
        <label class="toggle">
          <input type="checkbox" id="appendSymbol" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="controls format-section" data-format="random" hidden>
      <div class="control-row">
        <label for="randomLength">Length</label>
        <input type="range" min="8" max="48" value="16" id="randomLength">
        <span class="value" id="randomLengthVal">16</span>
      </div>
      <div class="control-row">
        <label for="useUpper">Uppercase (A–Z)</label>
        <label class="toggle">
          <input type="checkbox" id="useUpper" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="useLower">Lowercase (a–z)</label>
        <label class="toggle">
          <input type="checkbox" id="useLower" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="useDigits">Digits (0–9)</label>
        <label class="toggle">
          <input type="checkbox" id="useDigits" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="useSymbols">Symbols (!@#$…)</label>
        <label class="toggle">
          <input type="checkbox" id="useSymbols" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="avoidAmbig">Avoid ambiguous (I l 1 O 0 o)</label>
        <label class="toggle">
          <input type="checkbox" id="avoidAmbig">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="controls format-section" data-format="pronounceable" hidden>
      <div class="control-row">
        <label for="pronSyllables">Number of syllables</label>
        <input type="range" min="3" max="10" value="6" id="pronSyllables">
        <span class="value" id="pronSyllablesVal">6</span>
      </div>
      <div class="control-row">
        <label for="pronGroups">Hyphenate every N syllables</label>
        <input type="range" min="1" max="5" value="2" id="pronGroups">
        <span class="value" id="pronGroupsVal">2</span>
      </div>
      <div class="control-row">
        <label for="pronNumber">Append number group</label>
        <label class="toggle">
          <input type="checkbox" id="pronNumber" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row">
        <label for="pronDigits">Digits in number group</label>
        <input type="range" min="2" max="4" value="2" id="pronDigits">
        <span class="value" id="pronDigitsVal">2</span>
      </div>
      <div class="control-row">
        <label for="pronSymbol">Append symbol</label>
        <label class="toggle">
          <input type="checkbox" id="pronSymbol" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="meta">
      <span>Entropy: <strong id="entropy">—</strong> bits <span id="strengthLabel"></span></span>
      <span id="wordPoolSize">Word pool: — words</span>
    </div>
    <div class="strength-bar">
      <div class="strength-fill" id="strengthFill"></div>
    </div>

    <div class="format-section" data-format="words">
      <button class="wordlist-toggle" id="toggleWordlist" type="button">Show full word list</button>
      <div id="wordlist"></div>
    </div>

    <div class="history">
      <div class="history-header">
        <h2>Session history <span class="count" id="historyCount">(0/10)</span></h2>
        <button class="btn-clear" id="clearHistory" disabled>Clear</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">No passwords generated yet — click Generate to start.</li>
      </ul>
    </div>
  </main>

  <script>
    /**
     * Password generator — client-side only, no network calls.
     *
     * Random bytes are drawn from `crypto.getRandomValues` with rejection sampling
     * so there is no modulo bias in any selection.
     *
     * Three output formats are supported:
     *   words         — concatenated words from the curated pool below
     *   random        — uniformly random characters from configurable classes
     *   pronounceable — alternating consonant/vowel syllables
     *
     * Generated passwords are mirrored into an in-memory history capped at
     * HISTORY_MAX entries. History is intentionally not persisted; it is wiped
     * on page reload.
     */

    /**
     * Curated pool of nouns and adjectives.
     * No verbs (avoids accidental imperative phrases like "Kick-Cat").
     * No slang, body parts, weapons, or words with offensive secondary meanings.
     * Grouped below by category for ease of review; runtime order is irrelevant.
     * All entries are lowercase — `capitalize()` is applied at generation time.
     */
    const WORDS = [
      // Adjectives — colors, textures, qualities, temperature, feel
      "amber", "autumn", "azure", "balmy", "beige", "bold", "brave", "breezy", "bright", "bronze",
      "bubbly", "calm", "cheery", "chilly", "classy", "clever", "cloudy", "cool", "copper", "coral",
      "cosmic", "cozy", "creamy", "crimson", "crisp", "crystal", "cuddly", "dapper", "dazzling", "deep",
      "dewy", "dreamy", "elegant", "emerald", "fancy", "festive", "fluffy", "foggy", "frosty", "fuzzy",
      "gentle", "glassy", "gleaming", "glossy", "glowing", "golden", "graceful", "grand", "grassy", "happy",
      "hazel", "hearty", "honey", "hushed", "icy", "indigo", "ivory", "jade", "jolly", "joyful",
      "jumbo", "kind", "lacy", "lavender", "lemon", "lilac", "little", "lively", "lofty", "lovely",
      "loyal", "lucky", "lush", "magenta", "magical", "magnetic", "majestic", "maroon", "mellow", "merry",
      "mighty", "mild", "minty", "misty", "mossy", "navy", "neat", "nifty", "nimble", "noble",
      "ochre", "olive", "peaceful", "peachy", "pearl", "perky", "pink", "placid", "playful", "plucky",
      "plum", "plush", "polished", "precious", "pretty", "pristine", "proud", "puffy", "quaint", "quick",
      "quiet", "quirky", "radiant", "rainbow", "regal", "rosy", "royal", "ruby", "rustic", "saffron",
      "sandy", "sapphire", "satin", "savory", "scarlet", "scented", "serene", "shady", "shimmery", "shiny",
      "silken", "silky", "silly", "silver", "simple", "smooth", "snowy", "snug", "soft", "solar",
      "sparkly", "spicy", "splendid", "springy", "starry", "steady", "stellar", "sterling", "stylish", "sunlit",
      "sunny", "swift", "tangy", "teal", "tender", "thrifty", "tidy", "tiny", "toasty", "topaz",
      "tranquil", "turquoise", "valiant", "vast", "velvet", "vibrant", "vintage", "violet", "vivid", "warm",
      "whimsical", "wintry", "wise", "witty", "wooden", "woolly", "yellow", "zesty",

      // Animals
      "alpaca", "antelope", "badger", "beaver", "bison", "bobcat", "bunny", "butterfly", "camel", "capybara",
      "caribou", "chickadee", "chipmunk", "condor", "cougar", "crane", "cricket", "dolphin", "dragonfly", "duckling",
      "eagle", "falcon", "fawn", "ferret", "finch", "firefly", "flamingo", "fox", "frog", "gazelle",
      "gecko", "giraffe", "goldfish", "goose", "hamster", "hare", "hawk", "hedgehog", "heron", "hummingbird",
      "husky", "ibis", "iguana", "jaguar", "jellyfish", "kangaroo", "kingfisher", "kitten", "koala", "ladybug",
      "lamb", "lemur", "leopard", "lion", "lizard", "llama", "lobster", "lynx", "macaw", "magpie",
      "manatee", "mantis", "marmot", "meerkat", "mongoose", "moose", "narwhal", "newt", "nightingale", "ocelot",
      "octopus", "otter", "owl", "panda", "panther", "parrot", "peacock", "pelican", "penguin", "pheasant",
      "pigeon", "platypus", "pony", "porcupine", "puffin", "puppy", "quail", "rabbit", "raccoon", "raven",
      "reindeer", "robin", "salamander", "salmon", "sandpiper", "seahorse", "seal", "sheep", "sloth", "sparrow",
      "squid", "squirrel", "starfish", "stork", "swan", "tadpole", "tiger", "toucan", "turtle", "walrus",
      "warbler", "weasel", "whale", "wolf", "wombat", "wren", "yak", "zebra",

      // Plants, trees, flowers, herbs
      "acacia", "alder", "almond", "anemone", "apple", "apricot", "ash", "aspen", "aster", "azalea",
      "bamboo", "basil", "beech", "begonia", "birch", "bluebell", "buttercup", "cactus", "camellia", "carnation",

      "treehouse", "trellis", "trinket", "trolley", "trumpet", "tunnel", "ukulele", "umbrella", "vase", "veranda",
      "vest", "vineyard", "violin", "wagon", "wallet", "wand", "watch", "weathervane", "whistle", "windmill",
      "window", "workshop", "wreath", "xylophone", "yarn", "zither",

      // Fantasy, mythical, fairytale
      "amulet", "centaur", "charm", "dragon", "elf", "fable", "fairy", "fauna", "flora", "gargoyle",
      "genie", "ghost", "giant", "gnome", "griffin", "knight", "kraken", "legend", "manor", "mermaid",
      "monarch", "myth", "nymph", "oracle", "paladin", "pegasus", "phoenix", "pixie", "prince", "princess",
      "queen", "quest", "ranger", "realm", "rune", "scribe", "seer", "sentinel", "shire", "sorcerer",
      "spell", "sphinx", "sprite", "squire", "talisman", "titan", "tome", "troubadour", "unicorn", "vassal", "wizard"
    ];

    /** Punctuation pool used for separators and appended suffix. */
    const SYMBOLS = ['!', '@', '#', '$', '%', '&', '*', '+', '?', '=', '~', '^'];

    // =====================================================================
    // Random primitives
    // =====================================================================

    /**
     * Return an integer uniformly distributed in [0, max).
     * Uses rejection sampling over 32-bit crypto bytes to eliminate the
     * modulo bias that `crypto.getRandomValues(buf)[0] % max` would introduce.
     */
    function secureRandom(max) {
      const range = 2 ** 32;
      const limit = range - (range % max);
      const buf = new Uint32Array(1);
      let r;
      do {
        crypto.getRandomValues(buf);
        r = buf[0];
      } while (r >= limit);
      return r % max;
    }

    /** Return a uniformly random element from the array. */
    function pick(arr) { return arr[secureRandom(arr.length)]; }

    /** Uppercase the first character of the string. */
    function capitalize(s) { return s[0].toUpperCase() + s.slice(1); }

    /** Return a string of `n` random decimal digits. */
    function randomDigits(n) {
      let out = '';
      for (let i = 0; i < n; i++) out += secureRandom(10);
      return out;
    }

    // =====================================================================
    // Character pools (non-word formats)
    // =====================================================================

    const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const LOWER = 'abcdefghijklmnopqrstuvwxyz';
    const DIGITS = '0123456789';

    /** Glyphs commonly confused in many fonts; excluded when "avoid ambiguous" is on. */
    const AMBIG = /[Il1O0o]/g;

    /** Consonants for pronounceable syllables. Q, X, Y are omitted as they
     *  do not pair cleanly with a single following vowel. */
    const CONSONANTS = 'bcdfghjklmnprstvwz';
    const VOWELS = 'aeiou';

    // =====================================================================
    // Format: Words
    // Produces e.g. `Maple-47-Tiger!` — N capitalized words from WORDS,
    // joined by separators with optional numeric groups between them and
    // an optional trailing symbol.
    // =====================================================================

    /** Build a word-format password using the supplied options. */
    function generateWords(opts) {
      const sep = () => opts.symbolSep ? pick(SYMBOLS) : '-';
      const parts = [];
      for (let i = 0; i < opts.wordCount; i++) {
        if (i > 0) {
          parts.push(sep());
          parts.push(randomDigits(opts.digitCount));
          parts.push(sep());
        }
        parts.push(capitalize(pick(WORDS)));
      }
      if (opts.appendSymbol) parts.push(pick(SYMBOLS));
      return parts.join('');
    }

    /** Estimated entropy in bits for the words format. */
    function entropyWords(opts) {
      const wordBits = Math.log2(WORDS.length) * opts.wordCount;
      const numberBits = Math.log2(10) * opts.digitCount * (opts.wordCount - 1);
      let symBits = 0;
      if (opts.symbolSep) symBits += Math.log2(SYMBOLS.length) * (opts.wordCount - 1) * 2;
      if (opts.appendSymbol) symBits += Math.log2(SYMBOLS.length);
      return wordBits + numberBits + symBits;
    }

    // =====================================================================
    // Format: Random characters
    // Produces a uniformly random string drawn from the union of selected
    // character classes (upper, lower, digits, symbols), with optional
    // exclusion of visually ambiguous glyphs.
    // =====================================================================

    /** Compose the character pool from selected classes, applying the ambig filter. */
    function randomPool(opts) {
      let pool = '';
      if (opts.useUpper) pool += UPPER;
      if (opts.useLower) pool += LOWER;
      if (opts.useDigits) pool += DIGITS;
      if (opts.useSymbols) pool += SYMBOLS.join('');
      if (opts.avoidAmbig) pool = pool.replace(AMBIG, '');
      return pool;
    }

    /** Build a random-character password. Returns a hint string if the pool is empty. */
    function generateRandom(opts) {
      const pool = randomPool(opts);
      if (!pool) return '(select at least one character set)';
      let pw = '';
      for (let i = 0; i < opts.randomLength; i++) {
        pw += pool[secureRandom(pool.length)];
      }
      return pw;
    }

    /** Estimated entropy in bits for the random format. */
    function entropyRandom(opts) {
      const pool = randomPool(opts);
      return pool.length > 0 ? Math.log2(pool.length) * opts.randomLength : 0;
    }

    // =====================================================================
    // Format: Pronounceable
    // Produces strictly alternating consonant-vowel syllables, e.g.
    // `Bekafori-23!`. The CV pattern keeps each syllable typeable and
    // makes accidental English-word formation effectively impossible.
    // =====================================================================

    /** Build a pronounceable password with optional number and symbol suffixes. */
    function generatePronounceable(opts) {
      const group = Math.max(1, opts.pronGroups);
      let pw = '';
      for (let i = 0; i < opts.pronSyllables; i++) {
        if (i > 0 && i % group === 0) pw += '-';
        pw += CONSONANTS[secureRandom(CONSONANTS.length)];
        pw += VOWELS[secureRandom(VOWELS.length)];
      }
      pw = pw[0].toUpperCase() + pw.slice(1);
      if (opts.pronNumber) pw += '-' + randomDigits(opts.pronDigits);
      if (opts.pronSymbol) pw += pick(SYMBOLS);
      return pw;
    }

    /** Estimated entropy in bits for the pronounceable format. */
    function entropyPronounceable(opts) {
      const perSyllable = Math.log2(CONSONANTS.length * VOWELS.length);
      let bits = perSyllable * opts.pronSyllables;
      if (opts.pronNumber) bits += Math.log2(10) * opts.pronDigits;
      if (opts.pronSymbol) bits += Math.log2(SYMBOLS.length);
      return bits;
    }

    // =====================================================================
    // Dispatchers
    // =====================================================================

    /** Generate a password using the format named by opts.format. */
    function generate(opts) {
      switch (opts.format) {
        case 'random': return generateRandom(opts);
        case 'pronounceable': return generatePronounceable(opts);
        case 'words':
        default: return generateWords(opts);
      }
    }

    /** Estimated entropy in bits using the format named by opts.format. */
    function calcEntropy(opts) {
      switch (opts.format) {
        case 'random': return entropyRandom(opts);
        case 'pronounceable': return entropyPronounceable(opts);
        case 'words':
        default: return entropyWords(opts);
      }
    }

    /** Map entropy bits to a strength tier descriptor for the meter and bar. */
    function strengthInfo(bits) {
      if (bits < 35) return { label: '(weak)', cls: 'weak', pct: 25 };
      if (bits < 55) return { label: '(reasonable)', cls: 'ok', pct: 50 };
      if (bits < 75) return { label: '(strong)', cls: 'strong', pct: 75 };
      return { label: '(very strong)', cls: 'strong', pct: 100 };
    }

    // =====================================================================
    // DOM helpers and state
    // =====================================================================

    /** Shorthand for document.getElementById. */
    const $ = id => document.getElementById(id);

    /** Currently selected format; mirrored to the .active tab and visible .format-section. */
    let currentFormat = 'words';

    /** Snapshot every form input across all format panels into a single options object. */
    function getOpts() {
      return {
        format: currentFormat,
        // Words panel
        wordCount: +$('wordCount').value,
        digitCount: +$('digitCount').value,
        symbolSep: $('symbolSep').checked,
        appendSymbol: $('appendSymbol').checked,
        // Random panel
        randomLength: +$('randomLength').value,
        useUpper: $('useUpper').checked,
        useLower: $('useLower').checked,
        useDigits: $('useDigits').checked,
        useSymbols: $('useSymbols').checked,
        avoidAmbig: $('avoidAmbig').checked,
        // Pronounceable panel
        pronSyllables: +$('pronSyllables').value,
        pronGroups: +$('pronGroups').value,
        pronNumber: $('pronNumber').checked,
        pronDigits: +$('pronDigits').value,
        pronSymbol: $('pronSymbol').checked,
      };
    }

    /** Footer string describing the source pool for the active format. */
    function poolLabel(opts) {
      if (opts.format === 'words') return `Word pool: ${WORDS.length} words`;
      if (opts.format === 'random') return `Char pool: ${randomPool(opts).length} chars`;
      if (opts.format === 'pronounceable') return `Syllable pool: ${CONSONANTS.length * VOWELS.length}`;
      return '';
    }

    /** Sync all derived UI: slider value labels, entropy readout, strength bar, pool footer. */
    function updateMeta() {
      const opts = getOpts();

      $('wordCountVal').textContent = opts.wordCount;
      $('digitCountVal').textContent = opts.digitCount;
      $('randomLengthVal').textContent = opts.randomLength;
      $('pronSyllablesVal').textContent = opts.pronSyllables;
      $('pronGroupsVal').textContent = opts.pronGroups;
      $('pronDigitsVal').textContent = opts.pronDigits;

      const bits = calcEntropy(opts);
      $('entropy').textContent = bits.toFixed(1);
      const s = strengthInfo(bits);
      $('strengthLabel').textContent = ' ' + s.label;
      $('strengthFill').style.width = s.pct + '%';
      $('strengthFill').className = 'strength-fill ' + s.cls;
      $('wordPoolSize').textContent = poolLabel(opts);
    }

    // =====================================================================
    // Session history
    // In-memory ring buffer (index 0 = newest). Not persisted across reloads.
    // =====================================================================

    const HISTORY_MAX = 10;
    const history = [];

    /** Prepend a password to the history, deduplicating consecutive identical entries. */
    function addToHistory(pw) {
      if (history[0] === pw) return;
      history.unshift(pw);
      if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
      renderHistory();
    }

    /** Rebuild the visible history list from the in-memory array. */
    function renderHistory() {
      const list = $('historyList');
      $('historyCount').textContent = `(${history.length}/${HISTORY_MAX})`;
      $('clearHistory').disabled = history.length === 0;

      if (history.length === 0) {
        list.innerHTML = '<li class="history-empty">No passwords generated yet — click Generate to start.</li>';
        return;
      }

      list.innerHTML = '';
      history.forEach((pw, i) => {
        const li = document.createElement('li');
        li.className = 'history-item';

        const idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = (i + 1) + '.';

        const span = document.createElement('span');
        span.className = 'pw' + (i === 0 ? ' newest' : '');
        span.textContent = pw;

        const btn = document.createElement('button');
        btn.className = 'btn-mini';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          await copyText(pw);
          flashCopied(btn);
        });

        li.appendChild(idx);
        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    // =====================================================================
    // Clipboard
    // =====================================================================

    /**
     * Copy text to the system clipboard.
     * Falls back to a hidden textarea + execCommand on older browsers and
     * insecure contexts where navigator.clipboard is unavailable.
     */
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    /** Flash a "Copied!" label on a button for ~1.5s, restoring its original text after. */
    function flashCopied(btn) {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }

    // =====================================================================
    // Generation triggers
    // Two entry points distinguish "preview" (slider/toggle changes) from
    // "commit" (user explicitly asked for a new password). Only commits
    // record to history.
    // =====================================================================

    /** Regenerate the displayed password without writing to history. */
    function previewRegenerate() {
      updateMeta();
      $('password').textContent = generate(getOpts());
    }

    /** Regenerate the displayed password and prepend it to history. */
    function commitRegenerate() {
      updateMeta();
      const pw = generate(getOpts());
      $('password').textContent = pw;
      addToHistory(pw);
    }

    // =====================================================================
    // Event wiring
    // =====================================================================

    // Primary "Generate" button — commits to history.
    $('generate').addEventListener('click', commitRegenerate);

    // Slider/toggle changes inside any format panel only preview; they do
    // not commit to history so adjusting controls cannot flood the buffer.
    document.querySelectorAll('.format-section input').forEach(el => {
      el.addEventListener('input', previewRegenerate);
    });

    // Format tabs toggle the .active class and reveal the matching panel.
    document.querySelectorAll('.format-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentFormat = tab.dataset.format;
        document.querySelectorAll('.format-tab').forEach(t => {
          t.classList.toggle('active', t === tab);
        });
        document.querySelectorAll('.format-section').forEach(s => {
          s.hidden = s.dataset.format !== currentFormat;
        });
        previewRegenerate();
      });
    });

    // Copy the currently displayed password.
    $('copy').addEventListener('click', async () => {
      const text = $('password').textContent;
      if (!text || text === 'Click Generate') return;
      await copyText(text);
      flashCopied($('copy'));
    });

    // Wipe history buffer.
    $('clearHistory').addEventListener('click', () => {
      history.length = 0;
      renderHistory();
    });

    // Space or Enter outside of form controls generates a new password.
    document.addEventListener('keydown', e => {
      if (e.target.matches('input, button')) return;
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        commitRegenerate();
      }
    });

    // Expand/collapse the full word list (only relevant in Words mode).
    $('toggleWordlist').addEventListener('click', () => {
      const wl = $('wordlist');
      const btn = $('toggleWordlist');
      if (wl.classList.contains('show')) {
        wl.classList.remove('show');
        btn.textContent = 'Show full word list';
      } else {
        wl.textContent = WORDS.slice().sort().join('  ');
        wl.classList.add('show');
        btn.textContent = 'Hide word list';
      }
    });

    // =====================================================================
    // Initial render
    // Use previewRegenerate so the page-load password is not seeded into
    // history — the user hasn't asked for it yet.
    // =====================================================================
    previewRegenerate();
    renderHistory();
  </script>
